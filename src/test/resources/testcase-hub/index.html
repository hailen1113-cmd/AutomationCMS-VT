<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý testcase · AutomationVT</title>
  <style>
    :root {
      --bg: #f3efe6;
      --paper: #fffcf7;
      --ink: #1c2430;
      --muted: #667085;
      --line: #e4ddd0;
      --sidebar: #17202b;
      --accent: #0f766e;
      --accent-soft: #d9f2ee;
      --pass: #047857;
      --fail: #b42318;
      --skip: #b54708;
      --idle: #667085;
      --pass-bg: #ecfdf3;
      --fail-bg: #fef3f2;
      --skip-bg: #fffaeb;
      --idle-bg: #f2f4f7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.45 "Segoe UI", "Be Vietnam Pro", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100%; }
    aside {
      background: var(--sidebar);
      color: #e8edf3;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .01em; }
    .brand span { display: block; color: #9aa8b8; font-size: 12px; font-weight: 500; margin-top: 4px; }
    .nav-search, .toolbar input, .toolbar select {
      width: 100%;
      border: 1px solid #2b3948;
      background: #101821;
      color: #e8edf3;
      border-radius: 8px;
      padding: 9px 10px;
    }
    .modules { overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    .module-btn, .status-chip {
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .module-btn.active, .module-btn:hover { background: #243140; }
    .module-btn small { color: #9aa8b8; float: right; }
    main { padding: 24px 28px 40px; }
    .hero { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .subtitle { color: var(--muted); margin: 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }
    .actions button.secondary, #pager button {
      background: white; color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600;
    }
    .kpis { display: grid; grid-template-columns: repeat(6, minmax(110px, 1fr)); gap: 10px; margin: 22px 0; }
    .kpi { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .kpi b { display: block; font-size: 24px; }
    .kpi span { color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
    .toolbar input, .toolbar select {
      background: white;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    table { width: 100%; border-collapse: collapse; background: var(--paper); border-radius: 12px; overflow: hidden; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #faf7f1; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8f4ec; }
    .badge { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
    .PASS { background: var(--pass-bg); color: var(--pass); }
    .FAIL { background: var(--fail-bg); color: var(--fail); }
    .SKIP { background: var(--skip-bg); color: var(--skip); }
    .CHUA_CHAY { background: var(--idle-bg); color: var(--idle); }
    .flow { color: var(--muted); font-size: 13px; }
    .drawer {
      position: fixed; inset: 0 0 0 auto; width: min(460px, 92vw);
      background: var(--paper); border-left: 1px solid var(--line);
      padding: 24px; transform: translateX(100%); transition: transform .2s ease;
      box-shadow: -12px 0 40px rgba(23,32,43,.12); overflow: auto;
    }
    .drawer.open { transform: none; }
    .drawer h2 { margin-top: 0; }
    .meta { display: grid; gap: 10px; margin-top: 16px; }
    .meta div { background: #faf7f1; border-radius: 10px; padding: 10px 12px; }
    .meta b { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
    }
    @media print {
      aside, .toolbar, .actions, .drawer { display: none !important; }
      .app { display: block; }
      main { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">Quản lý testcase<span>Catalog · Flow · Kết quả</span></div>
      <input class="nav-search" id="moduleQuery" placeholder="Lọc module...">
      <div class="modules" id="modules"></div>
    </aside>
    <main>
      <div class="hero">
        <div>
          <h1>Báo cáo kiểm thử</h1>
          <p class="subtitle" id="generated"></p>
        </div>
        <div class="actions">
          <button type="button" id="exportCsv">Xuất CSV</button>
          <button type="button" class="secondary" id="exportHtml">Xuất HTML</button>
        </div>
      </div>
      <div class="kpis">
        <div class="kpi"><b id="kpiCatalog">0</b><span>Testcase catalog</span></div>
        <div class="kpi"><b id="kpiImplemented">0</b><span>Đã gắn UI test</span></div>
        <div class="kpi"><b id="kpiPass">0</b><span>Pass</span></div>
        <div class="kpi"><b id="kpiFail">0</b><span>Fail</span></div>
        <div class="kpi"><b id="kpiSkip">0</b><span>Skip</span></div>
        <div class="kpi"><b id="kpiIdle">0</b><span>Chưa chạy</span></div>
      </div>
      <div class="toolbar">
        <input id="search" placeholder="Tìm ID, testcase hoặc flow...">
        <select id="status">
          <option value="">Mọi kết quả</option>
          <option value="PASS">Pass</option>
          <option value="FAIL">Fail</option>
          <option value="SKIP">Skip</option>
          <option value="CHUA_CHAY">Chưa chạy</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Testcase</th>
            <th>Flow test</th>
            <th>Kết quả</th>
            <th>Thời gian</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>Không có testcase khớp bộ lọc.</div>
      <div class="toolbar" id="pager" style="margin-top:12px;align-items:center">
        <button type="button" class="secondary" id="prevPage">Trang trước</button>
        <span id="pageInfo"></span>
        <button type="button" class="secondary" id="nextPage">Trang sau</button>
      </div>
    </main>
  </div>
  <aside class="drawer" id="drawer"></aside>
  <script>
    const DATA = __TESTCASE_HUB_DATA__;
    const statusLabel = { PASS: "Pass", FAIL: "Fail", SKIP: "Skip", CHUA_CHAY: "Chưa chạy" };
    const PAGE_SIZE = 50;
    let moduleFilter = "";
    let page = 1;
    const $ = (id) => document.getElementById(id);

    function filtered() {
      const q = $("search").value.trim().toLowerCase();
      const status = $("status").value;
      return DATA.cases.filter((item) => {
        const haystack = [item.id, item.testcase, item.flow, item.flowDetail, item.module].join(" ").toLowerCase();
        return (!moduleFilter || item.module === moduleFilter)
            && (!status || item.status === status)
            && (!q || haystack.includes(q));
      });
    }

    function renderModules() {
      const q = $("moduleQuery").value.trim().toLowerCase();
      const counts = {};
      DATA.cases.forEach((item) => { counts[item.module] = (counts[item.module] || 0) + 1; });
      const names = Object.keys(counts).sort();
      $("modules").innerHTML = [`<button class="module-btn ${moduleFilter === "" ? "active" : ""}" data-module="">Tất cả <small>${DATA.cases.length}</small></button>`]
        .concat(names.filter((name) => !q || name.toLowerCase().includes(q)).map((name) =>
          `<button class="module-btn ${moduleFilter === name ? "active" : ""}" data-module="${escapeHtml(name)}">${escapeHtml(name)} <small>${counts[name]}</small></button>`
        )).join("");
    }

    function renderTable() {
      const rows = filtered();
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      if (page > totalPages) page = totalPages;
      const start = (page - 1) * PAGE_SIZE;
      const visible = rows.slice(start, start + PAGE_SIZE);
      $("empty").hidden = rows.length > 0;
      $("rows").innerHTML = visible.map((item) => `
        <tr data-id="${escapeHtml(item.id)}">
          <td><code>${escapeHtml(item.id)}</code></td>
          <td>${escapeHtml(item.testcase)}</td>
          <td class="flow">${escapeHtml(item.flow)}</td>
          <td><span class="badge ${item.status}">${statusLabel[item.status] || item.status}</span></td>
          <td>${escapeHtml(item.duration || "—")}</td>
        </tr>`).join("");
      $("pageInfo").textContent = rows.length
          ? `Hiển thị ${start + 1}-${start + visible.length} / ${rows.length}`
          : "0 testcase";
      $("prevPage").disabled = page <= 1;
      $("nextPage").disabled = page >= totalPages;
    }

    function renderKpis() {
      $("kpiCatalog").textContent = DATA.catalogCount;
      $("kpiImplemented").textContent = DATA.implementedCount;
      $("kpiPass").textContent = DATA.passed;
      $("kpiFail").textContent = DATA.failed;
      $("kpiSkip").textContent = DATA.skipped;
      $("kpiIdle").textContent = DATA.notRun;
      $("generated").textContent = (DATA.suiteName ? DATA.suiteName + " · " : "") + "Tạo lúc " + DATA.generatedAt;
    }

    function openDrawer(id) {
      const item = DATA.cases.find((row) => row.id === id);
      if (!item) return;
      $("drawer").classList.add("open");
      $("drawer").innerHTML = `
        <button class="secondary" id="closeDrawer" style="border:0;background:#eee;padding:8px 10px;border-radius:8px;cursor:pointer">Đóng</button>
        <h2>${escapeHtml(item.id)}</h2>
        <p>${escapeHtml(item.testcase)}</p>
        <div class="meta">
          <div><b>Module</b>${escapeHtml(item.module)}</div>
          <div><b>Flow test</b>${escapeHtml(item.flow)}</div>
          <div><b>Chi tiết flow</b>${escapeHtml(item.flowDetail || item.testcase)}</div>
          <div><b>Kết quả</b><span class="badge ${item.status}">${statusLabel[item.status] || item.status}</span></div>
          <div><b>Class / method</b>${escapeHtml((item.className || "—") + "." + (item.methodName || "—"))}</div>
          <div><b>Thời gian</b>${escapeHtml(item.duration || "Chưa chạy")}</div>
          <div><b>Ghi chú kết quả</b>${escapeHtml(item.error || "Không có")}</div>
        </div>`;
      $("closeDrawer").onclick = () => $("drawer").classList.remove("open");
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function toCsv(rows) {
      const header = ["ID", "Module", "Testcase", "Flow test", "Chi tiết flow", "Kết quả", "Thời gian", "Class", "Method", "Ghi chú"];
      const lines = [header].concat(rows.map((item) => [
        item.id, item.module, item.testcase, item.flow, item.flowDetail, statusLabel[item.status] || item.status,
        item.duration, item.className, item.methodName, item.error
      ]));
      return lines.map((cols) => cols.map((col) => `"${String(col == null ? "" : col).replaceAll('"', '""')}"`).join(",")).join("\n");
    }

    function download(name, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      link.click();
      URL.revokeObjectURL(url);
    }

    $("search").addEventListener("input", () => { page = 1; renderTable(); });
    $("status").addEventListener("change", () => { page = 1; renderTable(); });
    $("prevPage").addEventListener("click", () => { page = Math.max(1, page - 1); renderTable(); });
    $("nextPage").addEventListener("click", () => { page += 1; renderTable(); });
    $("moduleQuery").addEventListener("input", renderModules);
    $("modules").addEventListener("click", (event) => {
      const button = event.target.closest("[data-module]");
      if (!button) return;
      moduleFilter = button.getAttribute("data-module");
      page = 1;
      renderModules();
      renderTable();
    });
    $("rows").addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-id]");
      if (row) openDrawer(row.getAttribute("data-id"));
    });
    $("exportCsv").addEventListener("click", () => download("bao-cao-testcase.csv", toCsv(filtered()), "text/csv;charset=utf-8"));
    $("exportHtml").addEventListener("click", () => {
      download("bao-cao-testcase.html", document.documentElement.outerHTML, "text/html;charset=utf-8");
    });

    renderKpis();
    renderModules();
    renderTable();
  </script>
</body>
</html>
